# Проверка и публикация на GitHub Pages.
#  * при каждом push и pull request — тесты модели, сборка и сквозные тесты;
#  * при push в основную ветку — публикация сайта.
# В настройках репозитория: Settings → Pages → Source: «GitHub Actions».

name: Сайт

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Тесты и сборка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Тесты модели (сравнение с HHsim 3.7)
        run: npm test
      - name: Сборка
        run: npm run build
      - name: Сквозные тесты
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Публикация
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
